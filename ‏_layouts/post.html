<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>{{ page.title }} | M&B Rénovation</title>
    <meta name="description" content="{{ page.description }}">
    <meta name="theme-color" content="#080B12">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Jost:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* Design System M&B - Base */
        :root {
            --bg-void: #080B12;
            --bg-surface: #0E1220;
            --gold: #C9A84C;
            --gold-grad: linear-gradient(135deg, #E8C96A 0%, #C9A84C 40%, #9A7432 100%);
            --white: #FFFFFF;
            --silver: #B8C4D4;
            --muted: #5A6478;
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Jost', sans-serif;
            --border: 1px solid rgba(255,255,255,0.06);
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 16px; }
        body { background: var(--bg-void); color: var(--white); font-family: var(--font-sans); font-weight: 300; line-height: 1.8; overflow-x: hidden; }
        
        /* Navigation (Simplifiée pour le blog) */
        nav { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; padding: 0 5%; display: flex; align-items: center; justify-content: space-between; height: 70px; background: rgba(8, 11, 18, 0.95); border-bottom: var(--border); backdrop-filter: blur(10px); }
        .nav-logo { font-family: var(--font-serif); font-size: 1.6rem; color: var(--white); text-decoration: none; }
        .nav-logo em { color: var(--gold); font-style: italic; }
        .nav-back { color: var(--silver); text-decoration: none; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; transition: color 0.3s; }
        .nav-back:hover { color: var(--gold); }

        /* Conteneur de l'article */
        .article-container { max-width: 800px; margin: 150px auto 100px; padding: 0 5%; }
        .article-header { margin-bottom: 50px; text-align: center; }
        .article-title { font-family: var(--font-serif); font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 300; color: var(--white); margin-bottom: 15px; line-height: 1.1; }
        .article-meta { color: var(--gold); font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase; }
        
        /* Style du contenu Markdown */
        .article-content { color: var(--silver); font-size: 1.1rem; line-height: 2; }
        .article-content h2, .article-content h3 { font-family: var(--font-serif); color: var(--white); margin: 40px 0 20px; font-weight: 400; }
        .article-content h2 { font-size: 2.2rem; }
        .article-content p { margin-bottom: 20px; }
        .article-content img { max-width: 100%; height: auto; border-radius: 4px; margin: 30px 0; border: var(--border); }
        .article-content a { color: var(--gold); text-decoration: none; border-bottom: 1px solid transparent; transition: all 0.3s; }
        .article-content a:hover { border-bottom-color: var(--gold); }

        /* Footer simplifié */
        footer { background: #050810; border-top: var(--border); padding: 60px 5%; text-align: center; }
        .footer-logo { font-family: var(--font-serif); font-size: 1.5rem; color: var(--white); text-decoration: none; margin-bottom: 20px; display: block; }
        .footer-logo em { color: var(--gold); font-style: italic; }
        .footer-bottom { color: var(--muted); font-size: 0.8rem; }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="nav-logo">M&B <em>Rénovation</em></a>
        <a href="/" class="nav-back"><i class="fa-solid fa-arrow-left"></i> Retour au site</a>
    </nav>

    <main class="article-container">
        <header class="article-header">
            <h1 class="article-title">{{ page.title }}</h1>
            <div class="article-meta">Publié le {{ page.date | date: "%d/%m/%Y" }}</div>
        </header>

        <article class="article-content">
            {{ content }}
        </article>
    </main>

    <footer>
        <a href="/" class="footer-logo">M&B <em>Rénovation</em></a>
        <p class="footer-bottom">&copy; 2026 M&B Rénovation. L'excellence n'est pas un acte, c'est une habitude.</p>
    </footer>

</body>
</html>
