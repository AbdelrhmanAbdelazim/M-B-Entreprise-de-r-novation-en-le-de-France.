# Projets affichés sur /realisations/ et sur les pages /realisations/<slug>/.
# Source unique : modifier ici puis relancer `python3 _scripts/projets.py`.
# Le script génère les images WebP dans images/projets/<slug>/ et les pages dans _projets/.
#
# Champs :
#   titre, type (affiché sur la carte), ville (affichée sur la carte),
#   resume, collection (true = plusieurs chantiers regroupés par thème),
#   couverture (index de la photo de couverture, à partir de 0),
#   photos : src (fichier d'origine, jamais modifié), decoupe, etiquette, alt
#     decoupe : photo  = fichier brut, sans bandeau
#               cadre  = montage : on retire les bandeaux texte du haut et du bas
#               gauche / droite = moitié d'un montage avant/après côte à côte
#               haut / bas      = moitié d'un montage avant/après superposé
#     etiquette : avant / apres / en-cours / (vide)
#
# Règles : pas de prix ni de chiffres, pas de « sur mesure » ni de menuiserie,
# pas de visage, de plaque ni d'adresse sur les photos.
# Ville : « Paris · Île-de-France » tant que le gérant n'a pas donné la commune exacte.

