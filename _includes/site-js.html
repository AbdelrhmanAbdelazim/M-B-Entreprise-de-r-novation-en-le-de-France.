{%- if page.lightbox %}
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo agrandie">
    <button type="button" class="lightbox-btn lightbox-close" aria-label="Fermer">&#10005;</button>
    <button type="button" class="lightbox-btn lightbox-prev" aria-label="Photo précédente">&#8249;</button>
    <img alt="">
    <button type="button" class="lightbox-btn lightbox-next" aria-label="Photo suivante">&#8250;</button>
    <p class="lightbox-caption"></p>
</div>
{%- endif %}
<script>
(function () {
    var SANS_ENVOI = {{ site.apercu_sans_envoi | default: false }};
    var body = document.body;
    var menuBtn = document.getElementById('menuBtn');
    var menu = document.getElementById('mobileMenu');

    function syncInert() {
        var menuOpen = Boolean(menu && menu.open);
        body.classList.toggle('no-scroll', menuOpen);
        Array.prototype.forEach.call(body.children, function (el) {
            if (el.tagName === 'SCRIPT') return;
            var shouldInert = menuOpen && el !== menu;
            el.inert = shouldInert;
            if (shouldInert) el.setAttribute('inert', '');
            else el.removeAttribute('inert');
        });
    }

    function setMenu(open) {
        if (!menu) return;
        var wasOpen = menu.open;
        if (open && !wasOpen) menu.showModal();
        else if (!open && wasOpen) menu.close();
        if (menuBtn) menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
        syncInert();
        if (!open && wasOpen && menuBtn) menuBtn.focus();
    }

    if (menu) {
        menu.addEventListener('close', function () {
            if (menuBtn) menuBtn.setAttribute('aria-expanded', 'false');
            syncInert();
            if (menuBtn) menuBtn.focus();
        });
    }

    document.addEventListener('click', function (e) {
        var t = e.target;
        var devisTrigger = t.closest('[data-devis]');
        if (devisTrigger) {
            e.preventDefault();
            var formule = devisTrigger.getAttribute('data-formule') || 'devis';
            try { sessionStorage.setItem('mb_contact_type', formule); } catch (err) {}
            if (menu && menu.open) setMenu(false);
            window.location.href = '{% if site.apercu_sans_envoi %}/apercu/ac/#contact{% else %}/#contact{% endif %}';
            return;
        }
        var contactTrigger = t.closest('[data-contact-type]');
        if (contactTrigger) {
            var cType = contactTrigger.getAttribute('data-contact-type') || 'contact';
            try { sessionStorage.setItem('mb_contact_type', cType); } catch (err) {}
            if (menu && menu.open) setMenu(false);
        }
        if (t.closest('[data-menu-close]')) setMenu(false);
        if (t.closest('#menuBtn') && menu) setMenu(!menu.open);
    });

    /* Lightbox : groupes [data-gallery], liens <a href="grande image"> */
    var box = document.getElementById('lightbox');
    if (box) {
        var big = box.querySelector('img'), cap = box.querySelector('.lightbox-caption');
        var items = [], index = 0, opener = null;
        function show(i) {
            index = (i + items.length) % items.length;
            var a = items[index];
            big.src = a.getAttribute('href');
            big.alt = a.getAttribute('data-alt') || '';
            cap.textContent = a.getAttribute('data-caption') || big.alt;
        }
        function closeBox() { box.classList.remove('is-open'); body.style.overflow = ''; big.removeAttribute('src'); if (opener) opener.focus(); }
        document.addEventListener('click', function (e) {
            var a = e.target.closest('[data-gallery] a.gallery-item');
            if (!a) return;
            e.preventDefault();
            items = Array.prototype.slice.call(a.closest('[data-gallery]').querySelectorAll('a.gallery-item'));
            opener = a;
            show(items.indexOf(a));
            box.classList.add('is-open');
            body.style.overflow = 'hidden';
            box.querySelector('.lightbox-close').focus();
        });
        box.querySelector('.lightbox-close').addEventListener('click', closeBox);
        box.querySelector('.lightbox-prev').addEventListener('click', function () { show(index - 1); });
        box.querySelector('.lightbox-next').addEventListener('click', function () { show(index + 1); });
        box.addEventListener('click', function (e) { if (e.target === box) closeBox(); });
        var sx = null;
        box.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
        box.addEventListener('touchend', function (e) {
            if (sx === null) return;
            var dx = e.changedTouches[0].clientX - sx; sx = null;
            if (Math.abs(dx) > 40) show(index + (dx < 0 ? 1 : -1));
        });
    }

    document.addEventListener('keydown', function (e) {
        var lbOpen = box && box.classList.contains('is-open');
        if (e.key === 'Escape') {
            if (lbOpen) {
                box.querySelector('.lightbox-close').click();
            } else if (menu && menu.open) {
                e.preventDefault();
                setMenu(false);
            }
        } else if (lbOpen) {
            if (e.key === 'ArrowLeft') box.querySelector('.lightbox-prev').click();
            if (e.key === 'ArrowRight') box.querySelector('.lightbox-next').click();
        } else if (e.key === 'Tab' && menu && menu.open) {
            var mf = Array.prototype.filter.call(menu.querySelectorAll('button, a[href], summary'), function (el) {
                var det = el.closest('details');
                return !det || det.open || el.tagName === 'SUMMARY';
            });
            var mFirst = mf[0], mLast = mf[mf.length - 1];
            if (e.shiftKey && document.activeElement === mFirst) { e.preventDefault(); mLast.focus(); }
            else if (!e.shiftKey && document.activeElement === mLast) { e.preventDefault(); mFirst.focus(); }
        }
    });
})();
</script>
